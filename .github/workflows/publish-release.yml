name: Publish MOD release

on:
  push:
    branches: [master]
    paths:
      - release/**
      - tools/package_bundle.py
      - tools/bundle/**
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mod-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'NothingNullNull/LOMSave' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify packaged files and publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lomsave-release"
          cd "$RUNNER_TEMP/lomsave-release"

          fetch_file() {
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$1?ref=$GITHUB_SHA" \
              --output "$2"
          }
          fetch_file LOMSave2/LOMSave2Plugin.cs Plugin.cs
          version="$(python3 -c 'import pathlib,re; print(re.search(r"PluginVersion = \"(\d+\.\d+\.\d+)\"", pathlib.Path("Plugin.cs").read_text()).group(1))')"
          tag="v$version"
          archive="LOMSave-v$version.zip"
          bundle="LOMSave-v$version-OneClick.zip"
          for file in "$archive" "$bundle" LOMSave2.dll SHA256SUMS.txt; do
            fetch_file "release/$file" "$file"
          done
          sha256sum --check SHA256SUMS.txt
          mkdir -p tools/bundle
          fetch_file tools/package_bundle.py tools/package_bundle.py
          fetch_file tools/bundle/components.json tools/bundle/components.json
          python3 tools/package_bundle.py verify --release-dir . --version "$version"
          fetch_file CHANGELOG.md CHANGELOG.md
          python3 - "$version" <<'PY'
          import pathlib, sys
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          notes = changelog.split("\n## " + sys.argv[1] + "\n", 1)[1].split("\n## ", 1)[0].strip()
          notes += f"\n\n推荐下载 `LOMSave-v{sys.argv[1]}-OneClick.zip`，内含 BepInEx 5.4.23.5 Windows x64；关闭游戏后直接将全部内容解压覆盖到游戏根目录（Mortal.exe 所在文件夹），无需运行安装程序。"
          notes += "\n\n已安装对应加载器的用户可选普通 MOD 包或独立 DLL。旧 BepInEx 6 用户先备份并移走旧 core 目录，避免混用核心文件；移走旧 LOMSave.dll，只保留一份 LOMSave2.dll。从旧 x86 加载器升级时须同时覆盖 winhttp.dll。"
          notes += "\n\n安装与兼容性说明：[README](https://github.com/NothingNullNull/LOMSave#readme)。\n"
          pathlib.Path("RELEASE_NOTES.md").write_text(notes, encoding="utf-8")
          PY

          existing_release=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_release=true
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.immutable // false')" == true ]]; then
              echo "This release is immutable; publish a new version instead."
              exit 1
            fi
            existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
            old_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$existing_sha" --jq .tree.sha)"
            new_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
            old_mod="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$old_tree" --jq '.tree[] | select(.path == "LOMSave2") | .sha')"
            new_mod="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$new_tree" --jq '.tree[] | select(.path == "LOMSave2") | .sha')"
            if [[ -z "$old_mod" || "$old_mod" != "$new_mod" ]]; then
              echo "MOD source changed; publish a new version instead."
              exit 1
            fi
            mkdir -p baseline
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern LOMSave2.dll --dir baseline
            cmp LOMSave2.dll baseline/LOMSave2.dll
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --title "LOMSave $version" \
              --notes-file RELEASE_NOTES.md
          fi
          for file in "$archive" "$bundle" LOMSave2.dll SHA256SUMS.txt; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fxq -- "$file"; then
              mkdir -p existing
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern "$file" --dir existing
              if ! cmp -s "$file" "existing/$file"; then
                if [[ "$file" == LOMSave2.dll ]]; then
                  echo "Published DLL differs; publish a new version instead."
                  exit 1
                fi
                gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber
              fi
            else
              gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
          if [[ "$existing_release" == true && "$existing_sha" != "$GITHUB_SHA" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=false
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest --target "$GITHUB_SHA" --notes-file RELEASE_NOTES.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,assets
