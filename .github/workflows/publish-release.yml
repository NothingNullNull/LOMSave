name: Publish MOD release

on:
  push:
    branches: [master]
    paths:
      - release/**
      - Directory.Build.props
      - tools/package_bundle.py
      - tools/bundle/**
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mod-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'NothingNullNull/LOMSave' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify packaged files and publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lomsave-release"
          cd "$RUNNER_TEMP/lomsave-release"

          fetch_file() {
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$1?ref=$GITHUB_SHA" \
              --output "$2"
          }
          fetch_file LOMSave2/LOMSave2Plugin.cs Plugin.cs
          version="$(python3 -c 'import pathlib,re; print(re.search(r"PluginVersion = \"(\d+\.\d+\.\d+)\"", pathlib.Path("Plugin.cs").read_text()).group(1))')"
          tag="v$version"
          assets=(SHA256SUMS.txt)
          for major in 5 6; do
            assets+=("LOMSave2-BepInEx$major.dll" "LOMSave-v$version-BepInEx$major.zip" "LOMSave-v$version-BepInEx$major-OneClick.zip")
          done
          gh api "repos/$GITHUB_REPOSITORY/contents/release?ref=$GITHUB_SHA" \
            --jq '.[].name' > available-files.txt
          missing=false
          for file in "${assets[@]}"; do
            if ! grep -Fxq -- "$file" available-files.txt; then
              echo "::error file=release/$file::Missing release artifact: $file. Build both variants locally with tools/Build-Release.ps1 -OutputDir ./release and commit all seven release files."
              missing=true
            fi
          done
          if [[ "$missing" == true ]]; then exit 1; fi
          for file in "${assets[@]}"; do
            fetch_file "release/$file" "$file"
          done
          sha256sum --check SHA256SUMS.txt
          mkdir -p tools/bundle
          fetch_file tools/package_bundle.py tools/package_bundle.py
          for major in 5 6; do
            mkdir -p "tools/bundle/bepinex$major"
            fetch_file "tools/bundle/bepinex$major/components.json" "tools/bundle/bepinex$major/components.json"
          done
          python3 tools/package_bundle.py verify --release-dir . --version "$version"
          fetch_file CHANGELOG.md CHANGELOG.md
          python3 - "$version" <<'PY'
          import pathlib, sys
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = "\n## " + sys.argv[1] + "\n"
          if heading not in changelog:
              sys.exit(f"::error file=CHANGELOG.md::Missing release heading: ## {sys.argv[1]}. Remove the unpublished suffix before releasing.")
          notes = changelog.split(heading, 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              sys.exit(f"::error file=CHANGELOG.md::Release notes for {sys.argv[1]} are empty.")
          notes += f"\n\n本次同时提供两种构建，功能与存档格式相同：\n\n- BepInEx 5.4.23.5 用户：`LOMSave-v{sys.argv[1]}-BepInEx5-OneClick.zip`。\n- BepInEx 6.0.0-be.692 用户，以及使用对应骰子大师的玩家：`LOMSave-v{sys.argv[1]}-BepInEx6-OneClick.zip`。"
          notes += "\n\n一键包内含对应 Windows x64 Mono 加载器，解压到 Mortal.exe 所在目录即可；已有对应加载器可选同名普通包。独立 DLL 安装时改名为 LOMSave2.dll，放入 BepInEx/plugins/LOMSave2，只保留一份。切换加载器主版本前备份整套加载器并将旧 core/cache 移出游戏目录，5/6 核心和两种 MOD DLL 不能混装。无需转换现有 .dat/.dat.loms。"
          notes += "\n\n安装与兼容性说明：[README](https://github.com/NothingNullNull/LOMSave#readme)。\n"
          pathlib.Path("RELEASE_NOTES.md").write_text(notes, encoding="utf-8")
          PY

          existing_release=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_release=true
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.immutable // false')" == true ]]; then
              echo "This release is immutable; publish a new version instead."
              exit 1
            fi
            existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
            old_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$existing_sha" --jq .tree.sha)"
            new_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
            old_mod="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$old_tree" --jq '.tree[] | select(.path == "LOMSave2") | .sha')"
            new_mod="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$new_tree" --jq '.tree[] | select(.path == "LOMSave2") | .sha')"
            if [[ -z "$old_mod" || "$old_mod" != "$new_mod" ]]; then
              echo "MOD source changed; publish a new version instead."
              exit 1
            fi
            mkdir -p baseline
            for major in 5 6; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern "LOMSave2-BepInEx$major.dll" --dir baseline
              cmp "LOMSave2-BepInEx$major.dll" "baseline/LOMSave2-BepInEx$major.dll"
            done
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --title "LOMSave $version" \
              --notes-file RELEASE_NOTES.md
          fi
          for file in "${assets[@]}"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fxq -- "$file"; then
              mkdir -p existing
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern "$file" --dir existing
              if ! cmp -s "$file" "existing/$file"; then
                if [[ "$file" == *.dll ]]; then
                  echo "Published DLL differs; publish a new version instead."
                  exit 1
                fi
                gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber
              fi
            else
              gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
          if [[ "$existing_release" == true && "$existing_sha" != "$GITHUB_SHA" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=false
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest --target "$GITHUB_SHA" --notes-file RELEASE_NOTES.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,assets
